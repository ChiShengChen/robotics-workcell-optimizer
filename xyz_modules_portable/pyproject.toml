[project]
name = "xyz_modules"
version = "0.1.0"
description = "Portable robotics-workcell sub-systems: scoring, BOM, CAD I/O."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "ezdxf>=1.3",
    "opencv-python-headless>=4.10",
    "trimesh>=4.0",
]

[project.optional-dependencies]
step = ["cadquery>=2.7"]
gemini = ["google-genai>=0.3"]
full = ["cadquery>=2.7", "google-genai>=0.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xyz_modules*"]

[tool.setuptools.package-data]
xyz_modules = ["data/*.json"]
